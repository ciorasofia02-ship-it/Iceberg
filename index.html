<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMS — Academia de Istorie</title>

<style>

/* =====================================================
   FONTURI
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');


/* =====================================================
   VARIABILE
===================================================== */

:root{
    --bg:#07090d;
    --bg2:#0c1016;
    --card:#11161e;
    --card2:#151b24;
    --gold:#c9a45c;
    --gold-light:#e1c47c;
    --text:#e9e5dc;
    --muted:#a2a6ad;
    --line:#292f38;
    --white:#ffffff;
}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    line-height:1.8;
}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#080a0e;
}

::-webkit-scrollbar-thumb{
    background:#3a3428;
}

::-webkit-scrollbar-thumb:hover{
    background:var(--gold);
}


/* =====================================================
   COPERTĂ
===================================================== */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:40px 20px;

    background:
        radial-gradient(
            circle at center,
            #29313d 0%,
            #10151d 35%,
            #07090d 75%
        );

    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    inset:25px;

    border:1px solid rgba(201,164,92,.18);

    pointer-events:none;
}

.hero-content{
    max-width:1000px;
    position:relative;
    z-index:2;
}


/* LOGO */

.logo{
    width:260px;
    max-width:70%;
    margin-bottom:30px;

    filter:
        drop-shadow(0 15px 25px rgba(0,0,0,.6));
}


/* TITLU */

.hero h1{
    font-family:Cinzel,serif;
    font-size:clamp(38px,7vw,82px);
    letter-spacing:5px;
    color:var(--gold-light);
}

.hero-subtitle{
    color:#aaa;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-top:12px;
}

.gold-line{
    width:180px;
    height:1px;
    background:var(--gold);
    margin:25px auto;
}

.hero-description{
    max-width:720px;
    margin:auto;
    color:#9da2aa;
    font-size:17px;
}

.enter{
    display:inline-block;
    margin-top:40px;

    padding:15px 38px;

    border:1px solid var(--gold);

    color:var(--gold-light);

    text-decoration:none;

    letter-spacing:2px;

    transition:.3s;
}

.enter:hover{
    background:var(--gold);
    color:#080a0d;
}


/* =====================================================
   NAVIGAȚIE
===================================================== */

nav{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(6,8,12,.96);

    border-bottom:1px solid var(--line);

    backdrop-filter:blur(15px);

    display:flex;
    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:22px;

    padding:15px;
}

nav a{
    text-decoration:none;
    color:#aeb2b9;

    font-size:12px;
    letter-spacing:1.4px;

    transition:.3s;
}

nav a:hover{
    color:var(--gold-light);
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1150px;
    margin:auto;
    padding:90px 20px;
}
